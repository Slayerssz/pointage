# Construit l'application de bureau « Pointage » pour Windows et macOS.
#
# Elle n'embarque pas le site : elle l'ouvre depuis Vercel. Il n'y a donc
# à relancer cette construction QUE si l'on touche à l'enveloppe
# (src-tauri) — pas à chaque mise à jour du site, qui arrive toute seule.
#
# Pour lancer : onglet Actions → « Application de bureau » → Run workflow.

name: Application de bureau

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Numéro de version (ex. 1.0.0)"
        required: false
        default: "1.0.0"

permissions:
  contents: write

jobs:
  construire:
    strategy:
      fail-fast: false
      matrix:
        include:
          - poste: macos-latest
            cible: "--target universal-apple-darwin"
            nom: macOS
          - poste: windows-latest
            cible: ""
            nom: Windows

    name: ${{ matrix.nom }}
    runs-on: ${{ matrix.poste }}

    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.poste == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Dépendances système (Linux uniquement)
        if: matrix.poste == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Outils Tauri
        run: npm install --no-save @tauri-apps/cli@^2

      - name: Générer les icônes
        run: npx tauri icon src-tauri/icone-source.png

      - name: Construire
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.cible }}
          tauriScript: npx tauri

      - name: Récupérer les fichiers produits
        uses: actions/upload-artifact@v4
        with:
          name: pointage-${{ matrix.nom }}
          if-no-files-found: warn
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
