[package]
name = "pointage"
version = "1.0.0"
description = "Pointage — Groupe Triple A"
authors = ["Groupe Triple A"]
edition = "2021"

[lib]
name = "pointage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
